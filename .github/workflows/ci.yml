name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install
        
      - name: Run ESLint
        run: bun run lint
        
      - name: Type Check
        run: bun run type-check
        
      - name: Run Tests
        run: bun test
        
      - name: Build
        run: bun run build

  